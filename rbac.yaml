apiVersion: rbac.deckhouse.io/v1alpha1
resources:
  - group: storage.deckhouse.io
    resource: localstorageclasses
    system:
      manager:
        - create
        - delete
        - deletecollection
        - patch
        - update
      viewer:
        - get
        - list
        - watch
    legacy:
      ClusterEditor:
        - create
        - delete
        - deletecollection
        - patch
        - update
      User:
        - get
        - list
        - watch
prometheusAccess:
  path: csi
  name: prometheus-metrics
  deployments:
    - csi-controller
  daemonsets:
    - csi-node
  when: (.Values.global.enabledModules | has "prometheus")
  labels:
    app: csi-controller
access:
  - name: admin-kubeconfig
    subjects:
      - kind: Group
        name: kubeadm:cluster-admins
    clusterRules:
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - localstorageclasses
        verbs:
          - get
          - list
          - watch
          - create
          - delete
          - deletecollection
          - patch
          - update
