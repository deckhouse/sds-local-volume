- name: kubernetes.sds_local_volume.local_storage_class
  rules:
    - alert: D8SdsLocalVolumeLocalStorageClassNotReady
      expr: max by (name) (sds_local_volume_local_storage_class_ready) == 0
      # A class whose status has not been written yet also reports 0, and a class
      # being deleted reports 0 until its last finalizer goes. Both pass within
      # seconds when nothing is wrong; what stays is a class that failed or one
      # that another controller holds in its deletion.
      for: 15m
      labels:
        severity_level: "5"
        tier: cluster
      annotations:
        plk_markup_format: "markdown"
        plk_protocol_version: "1"
        plk_create_group_if_not_exists__d8_sds_local_volume_local_storage_class_health: "D8SdsLocalVolumeLocalStorageClassHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_sds_local_volume_local_storage_class_health: "D8SdsLocalVolumeLocalStorageClassHealth,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: LocalStorageClass {{ $labels.name }} is not Ready
        description: |
          The `Ready` condition of the LocalStorageClass `{{ $labels.name }}` has not been `True` for 15 minutes.

          Two states lead here, and the condition says which:
          - `reason: ReconcileFailed` — the controller could not bring the class to its spec, and the message says why. Changes to the class are not applied, and new PersistentVolumeClaims of the class may not be provisioned.
          - `reason: Deleting` — the class was asked to be deleted, the module has deleted its StorageClass and removed its own finalizer, and another finalizer still holds the resource.

          If the class has no `Ready` condition at all, the controller has not been able to write its status. The controller log says why.

          The recommended course of action:
          1. Read the condition: `d8 k get lsc {{ $labels.name }} -o jsonpath='{.status.conditions[?(@.type=="Ready")]}'`
          2. For `ReconcileFailed`, the message names the cause. Fix the spec or the LVMVolumeGroups it refers to (`d8 k get lvmvolumegroup`); the controller retries on its own. The controller log has the detail: `d8 k -n d8-sds-local-volume logs deploy/controller -c controller --tail=200 | grep {{ $labels.name }}`
          3. For `Deleting`, find who holds the class: `d8 k get lsc {{ $labels.name }} -o jsonpath='{.metadata.finalizers}'`. The finalizer belongs to the controller that put it there; look for the cause on that side rather than removing it by hand.
