x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      featureSnapshotsEnabled:
        type: boolean
        default: false
      csiControllerMetricsPort:
        type: integer
        default: 8080
        description: |
          The port the CSI controller serves its operation metrics on. The driver binds
          it on 127.0.0.1 and the kube-rbac-proxy of the same pod publishes the same
          number on the pod address -- two different sockets. Reaching it requires
          "get" on deployments/prometheus-metrics for csi-controller. What is on it is
          sds_local_volume_csi_operations_total and
          sds_local_volume_csi_operation_duration_seconds.

          The pod is not hostNetwork, so the number is pod-level and needs no entry in
          the Deckhouse port reference.
      csiNodeMetricsPort:
        type: integer
        default: 8080
        description: |
          The same for the CSI node DaemonSet. Reaching it requires "get" on
          daemonsets/prometheus-metrics for csi-node. The DaemonSet is not hostNetwork
          either, so it can share the number with the CSI controller: the two pods have
          separate network namespaces even on the same node.
      pythonVersions:
        type: array
        default: []
        items:
          type: string
      customWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      storageClassLabelIgnoredPrefixesSystem:
        type: array
        description: |
          System list of label-key prefixes that MUST NOT be propagated from
          a LocalStorageClass to the managed Kubernetes StorageClass.
          This list is hardcoded and cannot be changed by users.
        default:
          - app.kubernetes.io/managed-by
          - app.kubernetes.io/instance
          - kubernetes.io/
          - k8s.io/
          - storage.deckhouse.io/managed-by
        items:
          type: string
  registry:
    type: object
    description: "System field, overwritten by Deckhouse. Don't use"
