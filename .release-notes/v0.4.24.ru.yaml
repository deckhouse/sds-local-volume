date: "2026-11-14"

summary: "Модуль можно собрать в изолированной сети: сборка больше не обращается к базе контрольных сумм Go."

highlights:
  - "Сборка модуля больше не обращается к базе контрольных сумм Go (`sum.golang.org`) и использует кэш Go-модулей сборочного хоста, поэтому модуль собирается в изолированной сети из подготовленных кэшей."

improvements:
  - "Страницы release notes в документации рендерятся инструментом, закреплённым вместе с контрольными суммами в `.werf/tools/go.mod`, а кэш Go-модулей сборочного хоста (`~/go-pkg-cache`) сохраняется между сборками. В образах и в кластере ничего не меняется."
