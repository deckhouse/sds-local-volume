date: "2026-09-09"

summary: "LocalStorageClass умеет резервировать долю файловой системы под суперпользователя, исправлена взаимная блокировка csi-node, из-за которой отдельные узлы не могли подключить том, а сам релиз описывается разделами и на двух языках."

highlights:
  - "`LocalStorageClass` умеет запросить долю файловой системы под суперпользователя — классический резерв ext4 — аннотацией `storage.deckhouse.io/ext4-reserved-percent`. Без такого запроса тома, как и раньше, форматируются без резерва."
  - "Перезапуск `node-driver-registrar` больше не заклинивает узловой плагин. Из-за этой взаимной блокировки один-два узла кластера оставались без драйвера модуля в своём `CSINode` и не могли подключить том, пока соседние узлы работали нормально."
  - "Релиз описывается разделами — краткое описание, ключевые изменения, новый функционал, улучшения, исправления — по-английски и по-русски, и консоль показывает описание на языке читателя."

new_features:
  - "Аннотация `storage.deckhouse.io/ext4-reserved-percent` на `LocalStorageClass` задаёт долю файловой системы, оставляемую суперпользователю: целое число процентов от 0 до 50, по умолчанию 0. Значение идёт через `parameters` управляемого StorageClass и контекст тома CSI до `NodeStageVolume`, потому что CSI-драйвер не видит аннотаций StorageClass, и там его применяет `tune2fs`. Затрагивается только та файловая система, которую этот же вызов и создал: повторная стадия тома никогда не перезаписывает суперблок файловой системы, на которой уже есть данные, поэтому том сохраняет тот резерв, с которым был создан. Резерв работает только для семейства ext — при `fsType: xfs` аннотация игнорируется, и валидирующий webhook сообщает об этом предупреждением, — а некорректное значение этот же webhook отклоняет сразу, вместо того чтобы ронять каждый том класса на стадии подключения. Изменение аннотации заставляет контроллер пересоздать StorageClass, так как `parameters` существующего StorageClass в Kubernetes неизменяемы; существующие тома и PVC при этом не затрагиваются."

improvements:
  - "Release notes пишутся по локалям в `.release-notes/<тег>.yaml` и `<тег>.ru.yaml` с разделами `summary`, `highlights`, `new_features`, `improvements`, `fixes`, `security`, `breaking`, `upgrade_notes`, `known_issues`, `docs` и `dependencies`. В кластер попадают обе локали; релизы, выпущенные до этого, остаются в прежнем плоском формате и отображаются на той же странице точно так же, как раньше."

fixes:
  - "Перезапуск `node-driver-registrar` больше не уносит с собой CSI-драйвер. Проба liveness у csi-node смотрела на порт, который отдаёт регистратор, но была прикреплена к контейнеру драйвера, и они вставали в клинч: регистратор по своей логике завершается при неудачной регистрации, вместе с ним исчезает порт, проба убивает драйвер, пропадает сокет CSI, и перезапущенный регистратор до него уже не дотягивается. Узел поднимался с заклиненным узловым плагином — десяток перезапусков и отсутствие драйвера в его `CSINode`, то есть подключить том на таком узле было нельзя, — пока другие узлы того же кластера работали нормально. Теперь проба находится на том контейнере, который её обслуживает."
  - "Релизный тег без release notes публиковал пустой `changelog.yaml`, оставляя `ModuleRelease.spec.changelog` пустым при зелёной сборке. Теперь такой тег роняет сборку."

upgrade_notes:
  - "В конфигурации модуля делать ничего не нужно. Узел, чей под csi-node застрял во взаимной блокировке при регистрации, восстановится сам по мере раскатки исправленного пода DaemonSet — удалять поды руками не требуется."

docs:
  - "Появился раздел FAQ о доле тома, оставляемой суперпользователю: аннотация, диапазон значений, то, что резерв действует только на тома, созданные после этого, и то, что при `fsType: xfs` он игнорируется."
