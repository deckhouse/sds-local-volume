date: "2026-11-19"

summary: "LocalStorageClass с типом `Thin` показывает место в своих thin-пулах в `status.capacity`, DeleteVolume и DeleteSnapshot сообщают об успехе только после удаления логического тома, метрики контроллера требуют авторизации, а модуль потребляет меньше памяти на master-узлах."

highlights:
  - "LocalStorageClass с типом `Thin` показывает в `status.capacity` размер, записанные данные и свободное место своих thin-пулов, а дашборд показывает физически свободное место в thin-пулах рядом с местом, свободным с учётом `allocationLimit`."
  - "DeleteVolume и DeleteSnapshot больше не сообщают об успехе, пока существует LVMLogicalVolume или LVMLogicalVolumeSnapshot, поэтому PersistentVolume остаётся в `Released` с причиной в `kubectl describe pv`, пока логический том не удалён."
  - "Контроллер модуля отдаёт метрики по HTTPS и только тем, кому разрешено их читать."

new_features:
  - "LocalStorageClass с типом `Thin` показывает место в своих thin-пулах в `status.capacity`: размер, записанные данные, физически свободное место, выделенный объём и место, свободное с учётом `allocationLimit`, — суммой по пулам, со списком по каждому пулу и числом пулов, по которым статус LVMVolumeGroup не содержит данных. Величины свободного места выводятся в расширенных колонках `d8 k get localstorageclass`. Контроллер обновляет статус, когда величина меняется больше чем на 1% размера пула, либо раз в 5 минут. Записанные данные берутся из статуса LVMVolumeGroup, который публикует sds-node-configurator, поэтому `status.capacity.used` может отставать от данных на диске примерно на минуту и не больше чем примерно на 2% пула, а с релизами sds-node-configurator, которые обновляют `usedSize` только по событиям блочных устройств узла, — дольше."

improvements:
  - "Строка «Capacity by LocalStorageClass» дашборда «SDS Local Volume» показывает физически свободное место в thin-пулах класса `Thin` («Thin: free on disk» и колонка «Free on disk» таблицы: размер пула минус записанные в него данные) рядом с местом, свободным с учётом `allocationLimit`. Второе считает каждый снимок и каждый том, восстановленный из снимка, в полном размере источника, первое считает общий блок один раз."
  - "Модуль потребляет меньше памяти на master-узлах. Контроллер сам обслуживает admission-вебхуки (webhooks — проверки запросов к API) вместо отдельного контейнера `webhooks`, external-resizer CSI-контроллера больше не держит информер (informer — локальный кэш объектов с подпиской на изменения) по всем подам кластера, а контроллер хранит в кэше только метаданные и spec узлов, только собственный Secret с конфигурацией и не хранит `managedFields`. Service вебхуков, ValidatingWebhookConfiguration и их сертификат не меняются; поды контроллера при обновлении пересоздаются один раз."
  - "В режиме HA CSI-контроллер и контроллер модуля работают в двух репликах вместо одной на каждый master-узел и в одной реплике в кластере с одним master-узлом."

fixes:
  - "DeleteVolume и DeleteSnapshot больше не сообщают об успехе до того, как sds-node-configurator удалил логический том. Пока LVMLogicalVolume или LVMLogicalVolumeSnapshot существует, возвращается повторяемый статус `Aborted` с phase и reason, поэтому PersistentVolume остаётся в `Released`, а причина видна в `kubectl describe pv`. Отсутствующий объект считается уже удалённым, ошибки API возвращаются статусами `Unavailable` или `Internal`. Режим очистки тома записывается в LVMLogicalVolume при первом вызове DeleteVolume и сохраняется при повторах, поэтому очистка, которая идёт часами, не теряется, если LocalStorageClass за это время изменили или его не удалось прочитать."

security:
  - "Метрики контроллера модуля больше не отдаются по открытому HTTP всем, кто может достучаться до пода. Теперь контроллер отдаёт их по HTTPS и пропускает запрос только после TokenReview и SubjectAccessReview на `get` для `deployments/prometheus-metrics` своего Deployment, право на которое есть у Prometheus кластера. Job и имена метрик не меняются; порт Service теперь называется `https-metrics`."

docs:
  - "Документация называет модуль `storage-foundation`, а не `snapshot-controller`, модулем, который требуется для снимков томов, и больше не предлагает включать `snapshot-controller`."
  - "Описание `dataNodes` в настройках модуля теперь говорит, что компонент `csi-node` работает на узлах, подходящих под селектор, — по умолчанию на всех узлах с Linux, — а не что при пропуске параметра CSI размещается на всех узлах."
  - "В FAQ объяснено, почему thin-пул может заполниться, пока место, свободное с учётом `allocationLimit`, ещё велико: как снимки и восстановленные тома учитываются в двух величинах, где смотреть физически свободное место и что не входит в `usedSize`."
