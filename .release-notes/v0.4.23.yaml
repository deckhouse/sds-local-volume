date: "2026-11-12"

summary: "The CSI driver no longer provisions volumes with the ReadWriteMany or ReadOnlyMany access mode, which a local volume cannot serve, the documentation lists the supported access and volume modes, and the images are rebuilt on base images v4.0.12 with Go 1.27.4."

highlights:
  - "A PersistentVolumeClaim with the `ReadWriteMany` or `ReadOnlyMany` access mode is no longer provisioned: it stays `Pending` with a `ProvisioningFailed` event that names the rejected access mode. Volumes created before the update keep working."

fixes:
  - "The CSI driver no longer provisions a PersistentVolumeClaim with the `ReadWriteMany` or `ReadOnlyMany` access mode. Previously such a volume was created, although it is a logical volume on a single node and cannot be used from several nodes. The PersistentVolumeClaim now stays `Pending` with a `ProvisioningFailed` event naming the rejected access mode."

upgrade_notes:
  - "Only `ReadWriteOnce` is accepted for new volumes. Volumes that were already created with another access mode, for example `ReadWriteMany`, are not changed and keep working on the node where they live. A PersistentVolumeClaim that requests an unsupported access mode, such as one created by a Helm chart or an operator, stays `Pending` until its `accessModes` is changed to `ReadWriteOnce`."

docs:
  - "The documentation lists the supported access mode (`ReadWriteOnce`) and the unsupported ones (`ReadWriteOncePod`, `ReadWriteMany`, `ReadOnlyMany`), states that both `volumeMode: Filesystem` and `volumeMode: Block` are supported, and explains in the FAQ why a PersistentVolumeClaim stays `Pending`."

dependencies:
  - name: base images
    from: "v4.0.7"
    to: "v4.0.12"
    notes: "Every image of the module is rebuilt on the current base images."
  - name: Go
    from: "1.27.3"
    to: "1.27.4"
    notes: "The toolchain the Go components of the module are built with."
