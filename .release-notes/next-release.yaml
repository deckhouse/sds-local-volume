date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "The \"SDS Local Volume\" Grafana dashboard shows the capacity of a LocalStorageClass in the new \"Capacity by LocalStorageClass\" row: pick a class and read the size, free space and share used of its volume groups for a `Thick` class, or the size of its thin pools, the size allocated to volumes, the allocation limit, the space free by `allocationLimit` and the share filled with data for a `Thin` class, in total and per node and LVMVolumeGroup. The free space of a `Thin` class is the allocation limit less what is allocated to volumes, the same figure the module checks when it creates a volume, so overprovisioning is taken into account. The row is built on the new controller metric `sds_local_volume_local_storage_class_lvg_info{storage_class, lvg_name, thin_pool}`, which ties every LocalStorageClass to its LVMVolumeGroups and thin pools, and on the LVMVolumeGroup capacity metrics of sds-node-configurator."
  - "A VolumeSnapshot can be bound to an existing snapshot through a VolumeSnapshotContent created by hand, with `spec.source.snapshotHandle` set to the name of the LVMLogicalVolumeSnapshot, for example to bring back a snapshot kept by `deletionPolicy: Retain`. The CSI driver now checks such a handle: the snapshot becomes ready only when the LVMLogicalVolumeSnapshot exists and is `Created`, and `restoreSize` is filled in from its `status.size`. Before, any handle, a mistyped one included, was reported as a ready snapshot with no size, and the error surfaced only when a volume was restored from it. The scenario is described in the module usage documentation. Available in the editions with volume snapshots."

improvements:
  - "New alert `D8SdsLocalVolumeLocalStorageClassNotReady` fires when the `Ready` condition of a LocalStorageClass has not been `True` for 15 minutes: the controller could not apply the class (`reason: ReconcileFailed`), or another controller's finalizer holds the class in its deletion (`reason: Deleting`). The alert reads the existing metric `sds_local_volume_local_storage_class_ready`."
  - "A LocalStorageClass can no longer be created under the name of a StorageClass that belongs to another provisioner. The module names its StorageClass after the LocalStorageClass, so such a resource used to be created and then stay `Failed`; the webhook now rejects it at creation and names the StorageClass that holds the name."
  - "Removing a thin pool from `spec.thinPools` of an LVMVolumeGroup is now rejected while a LocalStorageClass uses that thin pool, whether the class names the LVMVolumeGroup or selects it by labels. sds-node-configurator removes a thin pool dropped from the spec once it is empty, and the class would then point at a thin pool that is gone. The check does not block LVMVolumeGroup updates while the module's webhook is unavailable."
  - "Errors of volume creation and expansion name the LVMVolumeGroup and its node, so the event of a PVC that cannot be provisioned or resized shows where the agent log is to be read. A failure to pick an LVMVolumeGroup now carries its cause, such as the node with no LVMVolumeGroup of the StorageClass. The CSI controller log adds the `lvg` and `node` fields to every line of a volume operation once the LVMVolumeGroup is known."
  - "New alert `D8SdsLocalVolumeNodeNeedsManualEviction` fires when a node has stayed in the module for 15 minutes after leaving its `nodeSelector`, because some of its LVMVolumeGroups are still listed in LocalStorageClasses. Such a node carries the `storage.deckhouse.io/sds-local-volume-need-manual-eviction` label and keeps the CSI node plugin; before, only a warning in the controller log reported it. The alert tells how to find the LVMVolumeGroups and LocalStorageClasses that hold the node and how to release it. It reads the new controller metric `sds_local_volume_node_manual_eviction_required{node}`."

fixes:
  - "The CSI controller could create a volume on an LVMVolumeGroup that is not `Ready`. With `volumeBindingMode: Immediate` it picked the node with the most free space among all LVMVolumeGroups of the StorageClass, whatever their phase, and with `WaitForFirstConsumer` it took the LVMVolumeGroup of the chosen node without looking at the phase, which mattered while the scheduler extender, registered with `failurePolicy: Ignore`, was unavailable. LVMVolumeGroups that are not `Ready` are now skipped when a node is picked, and a volume is not created on one: the error names the LVMVolumeGroup, its node and its phase."
  - "With `volumeBindingMode: Immediate`, an LVM-thin volume bigger than the available space of its thin pool no longer turns into an LVMLogicalVolume that the node fails with `not enough space` and the CSI controller deletes, again on every retry of the provisioner. The CSI controller compares the request with the available space of the thin pool, which already counts `allocationLimit`, and leaves the PVC `Pending` with an event that names the thin pool, its available space and `allocationLimit`. The error carries the `ResourceExhausted` code, as do the errors for a Thick volume that does not fit and for a StorageClass whose LVMVolumeGroups have no space left at all; the latter used to fail with `no LVMVolumeGroup found for node`."
  - "When the CSI driver fails to delete an LVMLogicalVolumeSnapshot, the deletion of the VolumeSnapshot is retried instead of being reported as done. The error used to be only logged, so the VolumeSnapshotContent went away while the LVMLogicalVolumeSnapshot and its logical volume stayed on the node. A snapshot that is already gone still counts as deleted."

docs:
  - "The FAQ no longer promises alerts at 20%, 10%, 5% and 1% of free space in a thin pool, which the module does not have. It now explains that overprovisioning is limited by `allocationLimit` of the thin pool in LVMVolumeGroup (`150%` by default, `100%` turns it off) and names the metrics to monitor the pool with."

