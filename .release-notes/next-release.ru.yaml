# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

docs:
  - "Документация называет модуль `storage-foundation`, а не `snapshot-controller`, модулем, который требуется для снимков томов, и больше не предлагает включать `snapshot-controller`."
  - "Описание `dataNodes` в настройках модуля теперь говорит, что компонент `csi-node` работает на узлах, подходящих под селектор, — по умолчанию на всех узлах с Linux, — а не что при пропуске параметра CSI размещается на всех узлах."
  - "В FAQ объяснено, почему thin-пул может заполниться, пока место, свободное с учётом `allocationLimit`, ещё велико: как снимки и восстановленные тома учитываются в двух величинах, где смотреть физически свободное место и что не входит в `usedSize`."

new_features:
  - "LocalStorageClass с типом `Thin` показывает место в своих thin-пулах в `status.capacity`: размер, записанные данные, физически свободное место, выделенный объём и место, свободное с учётом `allocationLimit`, — суммой по пулам, со списком по каждому пулу и числом пулов, по которым статус LVMVolumeGroup не содержит данных. Величины свободного места выводятся в расширенных колонках `d8 k get localstorageclass`. Контроллер обновляет статус, когда величина меняется больше чем на 1% размера пула, либо раз в 5 минут."

improvements:
  - "Строка «Capacity by LocalStorageClass» дашборда «SDS Local Volume» показывает физически свободное место в thin-пулах класса `Thin` («Thin: free on disk» и колонка «Free on disk» таблицы: размер пула минус записанные в него данные) рядом с местом, свободным с учётом `allocationLimit`. Второе считает каждый снимок и каждый том, восстановленный из снимка, в полном размере источника, первое считает общий блок один раз."

fixes:
  - "DeleteVolume и DeleteSnapshot больше не сообщают об успехе до того, как sds-node-configurator удалил логический том. Пока LVMLogicalVolume или LVMLogicalVolumeSnapshot существует, возвращается повторяемый статус `Aborted` с phase и reason, поэтому PersistentVolume остаётся в `Released`, а причина видна в `kubectl describe pv`. Отсутствующий объект считается уже удалённым, ошибки API возвращаются статусами `Unavailable` или `Internal`."

