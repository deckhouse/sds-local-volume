# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

improvements:
  - "В DKP 1.78 и новее роли `d8:system-capability:sds-local-volume:view` и `d8:system-capability:sds-local-volume:edit` дают также доступ на чтение к ModuleConfig `sds-local-volume`, а `edit` — и на запись, и несут стандартные заголовки и описания платформы, как все capability ролевой модели DKP 1.78. RBAC модуля теперь описан в `rbac.yaml`, и шаблоны RBACv2 пишутся из него; кластеры ниже DKP 1.78 сохраняют прежние роли."

fixes:
  - "Повторный `NodePublishVolume` блочного тома (`volumeMode: Block`) больше не накладывает ещё одно bind-монтирование (монтирование файла или каталога в другое место) на ту же цель. Раньше повторы kubelet могли накопить тысячи записей в `/proc/mounts` узла, из-за чего монтирование завершалось ошибкой (`ENOSPC`: таблица монтирований переполнена), а `df` зависал. Уже накопившиеся монтирования снимаются по одному при каждой повторной попытке отключения тома (unpublish) или перезагрузкой узла."
  - "Модуль больше не публикует объекты CSIStorageCapacity (сведения о доступной ёмкости хранилища для планировщика) с ложной ёмкостью 1M для своих StorageClass. Планировщик их не использовал, так как CSIDriver не включает учёт ёмкости хранилища (storage capacity tracking); узел для пода выбирает расширение планировщика (scheduler extender). Уже созданные объекты удаляются при обновлении."
  - "`CreateVolume` возвращает `InvalidArgument` для источника данных тома, который не является ни снимком, ни томом, вместо падения CSI-контроллера."
  - "Вебхук больше не падает при обновлении StorageClass модуля без полей `volumeBindingMode`, `reclaimPolicy` или `allowVolumeExpansion`; поле, заданное только в одной из двух версий, считается изменением."

docs:
  - "В FAQ описано, что происходит со снимками и восстановленными томами, когда один из них удаляют: том, восстановленный из снимка, — тонкий снимок copy-on-write (копирование при записи) в том же thin pool, удалять можно в любом порядке, а `allocationLimit` учитывает каждый снимок и восстановленный том в полном размере исходного. В руководстве больше не сказано, что том нельзя удалить полностью, пока у него есть снимок: это верно только для LVMLogicalVolume, удаляемого вручную после `reclaimPolicy: Retain`, а удаление PVC при `reclaimPolicy: Delete` удаляет логический том и оставляет снимок пригодным для восстановления."

