date: "2026-xx-xx"
summary: ""
highlights: []

improvements:
  - "В DKP 1.78 и новее роли `d8:system-capability:sds-local-volume:view` и `d8:system-capability:sds-local-volume:edit` дают также доступ на чтение к ModuleConfig `sds-local-volume`, а `edit` — и на запись, и несут стандартные заголовки и описания платформы, как все capability ролевой модели DKP 1.78. RBAC модуля теперь описан в `rbac.yaml`, и шаблоны RBACv2 пишутся из него; кластеры ниже DKP 1.78 сохраняют прежние роли."

docs:
  - "В FAQ описано, что происходит со снимками и восстановленными томами, когда один из них удаляют: том, восстановленный из снимка, — тонкий снимок copy-on-write (копирование при записи) в том же thin pool, удалять можно в любом порядке, а `allocationLimit` учитывает каждый снимок и восстановленный том в полном размере исходного. В руководстве больше не сказано, что том нельзя удалить полностью, пока у него есть снимок: это верно только для LVMLogicalVolume, удаляемого вручную после `reclaimPolicy: Retain`, а удаление PVC при `reclaimPolicy: Delete` удаляет логический том и оставляет снимок пригодным для восстановления."

