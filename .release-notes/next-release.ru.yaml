# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "На дашборде Grafana «SDS Local Volume» появилась строка «Capacity by LocalStorageClass» с ёмкостью LocalStorageClass: выберите класс и смотрите размер, свободное место и занятую долю его групп томов для класса `Thick` либо размер его thin-пулов, объём, выделенный томам, предел выделения, место, свободное с учётом `allocationLimit`, и долю, заполненную данными, для класса `Thin` — в сумме и по каждому узлу и LVMVolumeGroup. Свободное место класса `Thin` — это предел выделения за вычетом выделенного томам, та же величина, которую модуль проверяет при создании тома, поэтому overprovisioning (выделение томам больше места, чем есть в пуле) учтён. Строка построена на новой метрике контроллера `sds_local_volume_local_storage_class_lvg_info{storage_class, lvg_name, thin_pool}`, которая связывает каждый LocalStorageClass с его LVMVolumeGroup и thin-пулами, и на метриках ёмкости LVMVolumeGroup из sds-node-configurator."
  - "VolumeSnapshot можно привязать к существующему снимку через VolumeSnapshotContent, созданный вручную, указав в `spec.source.snapshotHandle` имя LVMLogicalVolumeSnapshot, — например, чтобы вернуть в работу снимок, сохранённый благодаря `deletionPolicy: Retain`. CSI-драйвер теперь проверяет такой идентификатор: снимок становится готовым, только если LVMLogicalVolumeSnapshot существует и находится в фазе `Created`, а `restoreSize` заполняется из его `status.size`. Раньше любой идентификатор, в том числе с опечаткой, считался готовым снимком без размера, и ошибка проявлялась только при восстановлении тома из него. Сценарий описан в документации по использованию модуля. Доступно в редакциях со снимками томов."
  - "LocalStorageClass теперь создаёт событие Kubernetes (Event), когда у условия `Ready` меняется статус или причина: `Warning` — когда оно становится `False`, `Normal` — когда снова становится `True`. Причина события совпадает с причиной условия — `ReconcileFailed`, `Reconciled`, `LVMVolumeGroupsOutsideCSINodes` или `Deleting`, — поэтому в `kubectl describe` видно, когда класс сломался и когда восстановился. Если проход согласования ничего не изменил, событие не создаётся. LocalStorageClass — кластерный ресурс, поэтому его события лежат в пространстве имён `default`."

improvements:
  - "Новый алерт `D8SdsLocalVolumeLocalStorageClassNotReady` срабатывает, когда условие `Ready` у LocalStorageClass 15 минут не в статусе `True`: контроллер не смог применить класс (`reason: ReconcileFailed`) или удаление класса удерживает финализатор другого контроллера (`reason: Deleting`). Алерт строится на уже существующей метрике `sds_local_volume_local_storage_class_ready`."
  - "LocalStorageClass больше нельзя создать с именем StorageClass другого провижинера. Модуль называет свой StorageClass по имени LocalStorageClass, поэтому такой ресурс раньше создавался и оставался в состоянии `Failed`; теперь вебхук отклоняет его при создании и называет StorageClass, который занимает имя."
  - "Удаление thin pool из `spec.thinPools` LVMVolumeGroup теперь отклоняется, пока его использует LocalStorageClass — по имени LVMVolumeGroup или через селектор меток. sds-node-configurator удаляет убранный из spec thin pool, как только он опустел, и класс ссылался бы на thin pool, которого больше нет. Пока вебхук модуля недоступен, проверка не блокирует изменения LVMVolumeGroup."
  - "Ошибки создания и расширения тома называют LVMVolumeGroup и её узел, поэтому по событию PVC, которую не удалось создать или расширить, видно, где читать лог агента. Ошибка выбора LVMVolumeGroup теперь содержит причину, например узел, на котором нет LVMVolumeGroup из StorageClass. Лог CSI-контроллера после выбора LVMVolumeGroup добавляет поля `lvg` и `node` в каждую строку операции с томом."
  - "Новый алерт `D8SdsLocalVolumeNodeNeedsManualEviction` срабатывает, когда узел 15 минут остаётся в модуле после выхода из его `nodeSelector`, потому что его LVMVolumeGroup всё ещё указаны в LocalStorageClass. На таком узле стоит метка `storage.deckhouse.io/sds-local-volume-need-manual-eviction` и остаётся CSI-плагин узла; раньше об этом сообщало только предупреждение в логе контроллера. Алерт объясняет, как найти LVMVolumeGroup и LocalStorageClass, которые удерживают узел, и как его освободить. Он читает новую метрику контроллера `sds_local_volume_node_manual_eviction_required{node}`."

fixes:
  - "CSI-контроллер мог создать том на LVMVolumeGroup не в фазе `Ready`. При `volumeBindingMode: Immediate` он выбирал узел с наибольшим свободным местом среди всех LVMVolumeGroup StorageClass независимо от их фазы, а при `WaitForFirstConsumer` брал LVMVolumeGroup выбранного узла, не глядя на фазу, — это имело значение, пока был недоступен scheduler extender, зарегистрированный с `failurePolicy: Ignore`. Теперь LVMVolumeGroup не в фазе `Ready` пропускаются при выборе узла, и том на такой группе не создаётся: ошибка называет LVMVolumeGroup, её узел и фазу."
  - "При `volumeBindingMode: Immediate` том LVM-thin, превышающий доступное место в своём thin pool, больше не превращается в LVMLogicalVolume, который узел отклоняет с ошибкой `not enough space`, а CSI-контроллер удаляет, и так при каждой повторной попытке провижинера. Теперь CSI-контроллер сравнивает запрос с доступным местом thin pool, в котором уже учтён `allocationLimit`, и оставляет PVC в состоянии `Pending` с событием, где названы thin pool, его доступное место и `allocationLimit`. Ошибка возвращается с кодом `ResourceExhausted`, как и ошибки для не помещающегося Thick-тома и для StorageClass, в LVMVolumeGroup которого не осталось места совсем; в последнем случае раньше приходила ошибка `no LVMVolumeGroup found for node`."
  - "Если CSI-драйверу не удалось удалить LVMLogicalVolumeSnapshot, удаление VolumeSnapshot повторяется, а не считается выполненным. Раньше ошибка только записывалась в лог, и VolumeSnapshotContent исчезал, а LVMLogicalVolumeSnapshot и его логический том оставались на узле. Уже удалённый снимок по-прежнему считается удалённым."
  - "Параметр `spec.lvm.volumeCleanup` в LocalStorageClass теперь работает в редакциях SE и SE+, как и указано в документации для всех коммерческих редакций. CSI-драйвер этих редакций его отклонял: PVC такого класса оставался в состоянии `Pending` с ошибкой `volume cleanup is not supported in your edition`, а том, в класс которого `volumeCleanup` добавили позже, не удалялся. Теперь очистка томов доступна во всех редакциях, кроме CE. Для неё нужен sds-node-configurator с таким же исправлением: том затирает его агент."
  - "Изменение меток StorageClass, созданного модулем, теперь применяется к существующему StorageClass, а не удаляет его и не создаёт заново. При пересоздании класс на мгновение пропадал, и PersistentVolumeClaim, пришедший в этот момент, не мог получить том. Изменение LVMVolumeGroup или `volumeCleanup` по-прежнему пересоздаёт StorageClass."
  - "Метка `storage.deckhouse.io/managed-by` на StorageClass, которые создаёт модуль, теперь содержит имя модуля — `sds-local-volume` — вместо `d8-sds-local-volume-storage-class-controller`. Существующие StorageClass получают новое значение при первом согласовании после обновления, без пересоздания. Селекторы меток и запросы мониторинга по старому значению нужно обновить."
  - "Снимки томов теперь работают в редакциях SE и SE+. CSI-драйвер этих редакций объявлял поддержку снимков, и модуль разворачивал csi-snapshotter, но вызовы снимков драйвера собирались только в образы EE и FE, поэтому каждый VolumeSnapshot оставался неготовым с ошибкой `Unimplemented`. Теперь код снимков собирается для всех редакций, кроме CE, — тех же, в которых sds-node-configurator обрабатывает LVMLogicalVolumeSnapshot."

docs:
  - "FAQ больше не обещает алертов при 20%, 10%, 5% и 1% свободного места в thin pool — у модуля их нет. Теперь там описано, что overprovisioning ограничивается полем `allocationLimit` у thin pool в LVMVolumeGroup (по умолчанию `150%`, значение `100%` его отключает), и названы метрики для контроля пула."

