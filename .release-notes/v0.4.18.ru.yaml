date: "2026-09-24"

summary: "Обновление безопасности CSI-драйвера и хуков модуля; поды CSI больше не используют порты из диапазона, отведённого сети узла."

highlights:
  - "`google.golang.org/grpc` обновлён с v1.82.1 до v1.83.2 в CSI-драйвере, что закрывает CVE-2026-84303, CVE-2026-84304 и CVE-2026-84445."

improvements:
  - "Livenessprobe контроллера CSI и CSI-плагина на узлах больше не использует порты 4250 и 4251 из диапазона 4200–4299, отведённого модулям, которые слушают порты в сети узла; оба пода работают в сети подов, и проба теперь использует порт по умолчанию внутри пода. При обновлении поды CSI перезапускаются."

security:
  - "`google.golang.org/grpc` обновлён с v1.82.1 до v1.83.2 в CSI-драйвере, что закрывает CVE-2026-84303, CVE-2026-84304 и CVE-2026-84445."
  - "`golang.org/x/crypto` обновлён с v0.53.0 до v0.57.0 в хуках модуля (`go-hooks`), что закрывает CVE-2026-56854 (обход аутентификации по адресу источника в `x/crypto/ssh`), CVE-2026-56855 и CVE-2026-78662."
