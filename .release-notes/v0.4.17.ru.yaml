date: "2026-09-15"

summary: "Модуль по умолчанию пишет логи на уровне INFO вместо DEBUG, поэтому установка, в которой уровень не выбирали, перестаёт получать отладочный вывод от компонентов CSI."

highlights:
  - "Значение `logLevel` по умолчанию теперь `INFO`, а не `DEBUG`. Там, где уровень не задавали в конфигурации модуля, CSI-контроллер и узловой плагин после обновления становятся заметно тише; вернуть прежнюю подробность можно, указав `logLevel: DEBUG`."

improvements:
  - "Значение `logLevel` в конфигурации модуля по умолчанию теперь `INFO`. Эта настройка задаёт `LOG_LEVEL` CSI-контроллера и узлового плагина `csi-node`, поэтому прежний умолчательный `DEBUG` означал, что каждая установка, где настройку не трогали, держала весь слой данных на отладочной подробности и платила за это объёмом логов. Явно указанный в ModuleConfig `logLevel` соблюдается ровно как раньше, каким бы он ни был."

upgrade_notes:
  - "В конфигурации модуля делать ничего не нужно. Там, где `logLevel` не задан, компоненты поднимутся на уровне `INFO` по мере раскатки подов при обновлении; там, где задан, уровень останется прежним. Чтобы сохранить прежнее поведение, укажите `logLevel: DEBUG` явно."
