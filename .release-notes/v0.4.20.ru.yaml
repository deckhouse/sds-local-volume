date: "2026-10-26"

summary: "Узловой CSI-плагин поставляется с объектом `SecurityPolicyException`, который DKP 1.79 требует для системных подов, sidecar-контейнеры CSI пишут логи с уровнем из `logLevel`, а из образов модуля убраны уязвимости Go-зависимостей, найденные сканером."

highlights:
  - "Модуль поставляет `SecurityPolicyException` для DaemonSet `csi-node` в `d8-sds-local-volume`, поэтому его поды продолжат запускаться, когда в DKP 1.79 стандарты безопасности подов (Pod Security Standards) в системных пространствах имён перейдут от предупреждения к запрету."

improvements:
  - "DaemonSet `csi-node` получает `SecurityPolicyException` с описанием каждой привилегии, которая нужна ему сверх профиля `restricted`: привилегированный контейнер `node`, запуск контейнеров `node` и `node-driver-registrar` от root с повышением привилегий и тома hostPath (каталоги узла, подключённые в под) для каталогов kubelet и `/dev`. Его поды получают метку `security.deckhouse.io/security-policy-exception`, ссылающуюся на этот объект. Контроллер модуля и CSI-контроллер и так укладываются в профиль `restricted`, исключения для них нет. Объект создаётся, только если в кластере доступен ресурс `SecurityPolicyException` (включён модуль `admission-policy-engine-crd`); на более ранних платформах ничего не меняется."

fixes:
  - "Sidecar-контейнеры CSI контроллера и `node-driver-registrar` работали с фиксированным `--v=5` независимо от значения `logLevel`. Теперь их уровень детализации следует `logLevel`: `ERROR`, `WARN`, `INFO`, `DEBUG` и `TRACE` дают `--v=0`, `1`, `2`, `4` и `5`. Значение по умолчанию `INFO` даёт `--v=2`, а `TRACE` сохраняет прежнюю подробность."

security:
  - "Обновлены Go-зависимости CSI-драйвера, контроллера модуля, вебхуков и хуков, что убирает CVE-2026-78669, CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-97032, CVE-2026-56851, CVE-2026-63209 и CVE-2026-85747 из результатов сканирования образов модуля."

upgrade_notes:
  - "Руками делать ничего не нужно. Поды CSI-контроллера и `csi-node` один раз перезапускаются из-за новых аргументов логирования, а там, где доступен ресурс `SecurityPolicyException`, — и из-за новой метки."
