Изменения:
  - Модуль snapshot-controller больше не обязательная зависимость: VolumeSnapshotClass создаётся только при наличии API snapshot.storage.k8s.io
  - Добавлены метрики контроллера и CSI-драйвера (ранее модуль не экспортировал ничего), логирование переведено на общие библиотеки Deckhouse
  - Исправление: размер тома при обычном создании выравнивается по границе экстента LVM, ёмкость тома и restoreSize снапшота сообщаются по фактическому размеру LV — ранее запрос на 35Mi давал LV в 36Mi, описанный как 35Mi
  - Исправление: восстановление снапшота или клонирование в StorageClass типа Thick теперь отклоняется — ранее получался Bound PVC без данных
  - Исправление: проверка свободного места для Thick выполняется по выровненному размеру, ошибка выбора узла с максимумом свободного места больше не игнорируется
  - Обновление базовых образов и lib-helm до 1.72.11
  - Устранена уязвимость в gRPC (GHSA-hrxh-6v49-42gf)
  - Внутренние изменения в сборке модуля
