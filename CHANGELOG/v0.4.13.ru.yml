Изменения:
  - Исправление: LVMLogicalVolume и LVMLogicalVolumeSnapshot, оставшиеся после удаления PersistentVolume со StorageClass с reclaimPolicy Retain, больше не остаются навсегда — добавлен сборщик, снимающий финализатор модуля с ресурсов, удаление которых уже запрошено и на которые никто не ссылается. Раньше место в группе томов оставалось занятым, команда удаления LVMLogicalVolume не завершалась, и финализатор приходилось снимать вручную
  - Добавлены метрики по логическим томам и по томам, пережившим свой PersistentVolume, пять правил алертинга и дашборд «SDS Local Volume»; описан порядок ручного освобождения места при reclaimPolicy Retain
  - LocalStorageClass публикует status.conditions и status.observedGeneration
  - Исправление: сообщение условия обрезается до допустимой схемой длины
  - Обновление базовых образов до v1.3.25 и lib-helm до 1.72.13
