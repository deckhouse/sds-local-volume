{{- include "helm_lib_csi_controller_rbac" . }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: d8:{{ .Chart.Name }}:sds-local-volume-csi-controller
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-local-volume-csi-controller")) | nindent 2 }}
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - lvmvolumegroups
      - lvmlogicalvolumes
      - lvmlogicalvolumesnapshots
      - localstorageclasses
    verbs:
      - get
      - list
      - create
      - delete
      - watch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:sds-local-volume-csi-controller
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-local-volume-csi-controller")) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: csi
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: ClusterRole
  name: d8:{{ .Chart.Name }}:sds-local-volume-csi-controller
  apiGroup: rbac.authorization.k8s.io

---
{{- /*
  Both CSI pods -- the controller Deployment and the node DaemonSet -- carry a
  kube-rbac-proxy in front of their metrics port, and both run under the "csi"
  ServiceAccount. The proxy answers every scrape by asking the API server who the
  caller is (TokenReview) and whether they hold get on the prometheus-metrics
  subresource (SubjectAccessReview). Both verbs live in d8:rbac-proxy, and
  helm_lib_csi_controller_rbac does not grant them. Without this binding the proxy
  fails closed with 401 while the pods stay Ready, so the only symptom is up == 0
  on both CSI jobs and a TargetDown that never clears.

  One binding for both workloads, because one ServiceAccount serves both.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:csi:rbac-proxy
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: csi
    namespace: d8-{{ .Chart.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:rbac-proxy
