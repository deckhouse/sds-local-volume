{{- /* Webhook TLS Certs Secret */ -}}
{{- $secretConfig := dict
  "valuesKey" "sdsLocalVolume"
  "webhookCertPath" "internal.customWebhookCert"
}}
{{ include "helm_lib_module_webhook_certs_secret" (list . $secretConfig) }}

{{- /*
  LLV_ORPHAN_GRACE_PERIOD is passed explicitly rather than left to the binary's
  default, so that the llvOrphanGracePeriod setting is reachable through a
  ModuleConfig. Without this the value would only be settable by editing the
  Deployment, which the addon-operator reverts on the next reconcile.

  The variable is omitted rather than defaulted when the setting is absent, so the
  fallback stays stated once — as the Go constant — instead of being restated here
  where it could drift.
*/ -}}
{{- $controllerEnvs := list }}
{{- with .Values.sdsLocalVolume.llvOrphanGracePeriod }}
  {{- $controllerEnvs = append $controllerEnvs (dict "name" "LLV_ORPHAN_GRACE_PERIOD" "value" .) }}
{{- end }}

{{- /* Controller Deployment */ -}}
{{- $config := dict
  "valuesKey" "sdsLocalVolume"
  "webhookEnabled" true
  "webhooksInController" true
  "webhookCertPath" "internal.customWebhookCert"
  "onMasterNode" true
  "podSecurityContext" "deckhouse"
  "controllerMetricsPort" (int .Values.sdsLocalVolume.internal.controllerMetricsPort)
  "controllerMetricsProxyPort" (int .Values.sdsLocalVolume.internal.controllerMetricsProxyPort)
  "controllerMetricsInProcessAuthorization" true
  "additionalControllerEnvs" $controllerEnvs
}}
{{ include "helm_lib_module_controller_manifests" (list . $config) }}

{{- /* Webhook Service with metrics port */ -}}
{{- $serviceConfig := dict
  "additionalPorts" (list
    (dict "name" "https-metrics" "port" (int .Values.sdsLocalVolume.internal.controllerMetricsProxyPort) "targetPort" "https-metrics")
  )
}}
{{ include "helm_lib_module_webhook_service" (list . $serviceConfig) }}

{{- /* ValidatingWebhookConfiguration for LocalStorageClasses */ -}}
{{- $lscWebhookConfig := dict
  "name" "lsc-validation"
  "webhookName" "lsc-validation"
  "valuesKey" "sdsLocalVolume"
  "path" "/lsc-validate"
  "failurePolicy" "Fail"
  "rules" (list (dict "apiGroups" (list "storage.deckhouse.io") "apiVersions" (list "v1alpha1") "operations" (list "CREATE" "UPDATE") "resources" (list "localstorageclasses") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $lscWebhookConfig) }}

{{- /* ValidatingWebhookConfiguration for LVMVolumeGroups: keeps a thin pool a
       LocalStorageClass uses in spec.thinPools. Written out rather than through
       helm_lib_module_validating_webhook_configuration, which has no failurePolicy:
       an unavailable webhook of this module must not block sds-node-configurator. */}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: d8-{{ .Chart.Name }}-lvg-validation
  annotations:
    werf.io/deploy-dependency-controller: state=ready,kind=Deployment,name=controller,namespace=d8-{{ .Chart.Name }}
    werf.io/deploy-dependency-service: state=present,kind=Service,name=webhooks,namespace=d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
webhooks:
  - name: d8-{{ .Chart.Name }}-lvg-validation.deckhouse.io
    rules:
      - apiGroups: ["storage.deckhouse.io"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["lvmvolumegroups"]
        scope: "Cluster"
    clientConfig:
      service:
        namespace: d8-{{ .Chart.Name }}
        name: webhooks
        path: /lvg-validate
      caBundle: {{ .Values.sdsLocalVolume.internal.customWebhookCert.ca | b64enc | quote }}
    admissionReviewVersions: ["v1", "v1beta1"]
    failurePolicy: Ignore
    sideEffects: None
    timeoutSeconds: 5

{{- /* ValidatingWebhookConfiguration for StorageClasses */ -}}
{{- $scWebhookConfig := dict
  "name" "sc-validation"
  "webhookName" "sc-validation"
  "valuesKey" "sdsLocalVolume"
  "path" "/sc-validate"
  "rules" (list (dict "apiGroups" (list "storage.k8s.io") "apiVersions" (list "v1") "operations" (list "*") "resources" (list "storageclasses") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $scWebhookConfig) }}
