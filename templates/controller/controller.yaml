{{- /* Webhook TLS Certs Secret */ -}}
{{- $secretConfig := dict
  "valuesKey" "sdsLocalVolume"
  "webhookCertPath" "internal.customWebhookCert"
}}
{{ include "helm_lib_module_webhook_certs_secret" (list . $secretConfig) }}

{{- /*
  The webhooks container takes its log level as a flag, because
  helm_lib_module_controller_manifests injects no env into it but does allow the
  command to be overridden. The value is the same numeric verbosity the
  controller gets through LOG_LEVEL.

  Overriding the command means restating the TLS flags, so the cert mount path is
  set explicitly here and reused, rather than relying on the lib-helm default
  matching the literal below.
*/ -}}
{{- $webhooksCertMountPath := "/etc/webhook/certs" }}
{{- $webhooksCommand := list
  "/webhooks"
  (printf "-tls-cert-file=%s/tls.crt" $webhooksCertMountPath)
  (printf "-tls-key-file=%s/tls.key" $webhooksCertMountPath)
  (printf "-log-level=%s" (include "helm_lib_module_controller_log_level" (list . "sdsLocalVolume")))
}}

{{- /* Controller Deployment */ -}}
{{- $config := dict
  "valuesKey" "sdsLocalVolume"
  "webhookEnabled" true
  "webhookCertPath" "internal.customWebhookCert"
  "onMasterNode" true
  "podSecurityContext" "deckhouse"
  "controllerMetricsPort" 8080
  "webhooksCertMountPath" $webhooksCertMountPath
  "webhooksCommand" $webhooksCommand
}}
{{ include "helm_lib_module_controller_manifests" (list . $config) }}

{{- /* Webhook Service with metrics port */ -}}
{{- $serviceConfig := dict
  "additionalPorts" (list
    (dict "name" "metrics" "port" 8080 "targetPort" "metrics")
  )
}}
{{ include "helm_lib_module_webhook_service" (list . $serviceConfig) }}

{{- /* ValidatingWebhookConfiguration for LocalStorageClasses */ -}}
{{- $lscWebhookConfig := dict
  "name" "lsc-validation"
  "webhookName" "lsc-validation"
  "valuesKey" "sdsLocalVolume"
  "path" "/lsc-validate"
  "failurePolicy" "Fail"
  "rules" (list (dict "apiGroups" (list "storage.deckhouse.io") "apiVersions" (list "v1alpha1") "operations" (list "CREATE" "UPDATE") "resources" (list "localstorageclasses") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $lscWebhookConfig) }}

{{- /* ValidatingWebhookConfiguration for StorageClasses */ -}}
{{- $scWebhookConfig := dict
  "name" "sc-validation"
  "webhookName" "sc-validation"
  "valuesKey" "sdsLocalVolume"
  "path" "/sc-validate"
  "rules" (list (dict "apiGroups" (list "storage.k8s.io") "apiVersions" (list "v1") "operations" (list "*") "resources" (list "storageclasses") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $scWebhookConfig) }}
