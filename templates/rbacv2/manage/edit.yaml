{{- if eq (include "sds-local-volume.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:sds-local-volume:edit
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/aggregate-to-storage-as" "manager" "rbac.deckhouse.io/capability" "system-capability.sds-local-volume.edit" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/namespace" "d8-sds-local-volume" "rbac.deckhouse.io/scope" "system")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Manage the sds-local-volume module configuration."
    en.meta.deckhouse.io/title: "Module sds-local-volume: edit configuration"
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля sds-local-volume."
    ru.meta.deckhouse.io/title: "Модуль sds-local-volume: управление конфигурацией"
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - moduleconfigs
  resourceNames:
  - sds-local-volume
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - storage.deckhouse.io
  resources:
  - localstorageclasses
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: sds-local-volume
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-sds-local-volume
  name: d8:manage:permission:module:sds-local-volume:edit
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - localstorageclasses
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- end }}
