{{- if eq (include "sds-local-volume.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: sds-local-volume
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.sds-local-volume.edit"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-sds-local-volume
  name: d8:system-capability:sds-local-volume:edit
  annotations:
    en.meta.deckhouse.io/title: "Module sds-local-volume: manage cluster resources"
    ru.meta.deckhouse.io/title: "Модуль sds-local-volume: управление кластерными ресурсами"
    en.meta.deckhouse.io/description: "Create, update and delete the cluster-scoped resources of the sds-local-volume module (LocalStorageClass)."
    ru.meta.deckhouse.io/description: "Создание, изменение и удаление кластерных ресурсов модуля sds-local-volume (LocalStorageClass)."
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - localstorageclasses
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: sds-local-volume
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-sds-local-volume
  name: d8:manage:permission:module:sds-local-volume:edit
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - localstorageclasses
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- end }}
