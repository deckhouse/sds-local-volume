---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false

git:
  - add: {{ .ModuleDir }}
    to: /src
    includePaths:
      - api
      - lib/go
      - images/{{ $.ImageName }}
    stageDependencies:
      install:
        - '**/*'
    excludePaths:
      - images/{{ $.ImageName }}/werf.inc.yaml

shell:
  install:
    - rm -rf /src/.git

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-golang-artifact
from: {{ index $.Images "builder/golang" }}
final: false

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
    add: /src
    to: /src
    before: setup

mount:
{{ include "mount points for golang builds" . }}

secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
{{ include "secret for private go modules" . }}

shell:
  setup:
    {{- include "svace toolchain for golang builds" . | nindent 4 }}
    {{- include "auth for private go modules" . | nindent 4 }}
    - cd /src/images/{{ $.ImageName }}/cmd
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
    - |
      {{- include "image-build.build" (set $ "BuildCommand" (printf `go build -ldflags="-s -w" -tags "%s" -o /%s` .MODULE_EDITION $.ImageName)) | nindent 6 }}
    # An absolute mode, not `+x`, which is masked by whatever umask is in effect and can therefore grant
    # execute to the owner alone. The binary is then runnable by root only, and every workload that runs
    # it as a non-root user with `capabilities: drop: [ALL]` — that is, without CAP_DAC_OVERRIDE to
    # bypass the permission bits — fails to start with "permission denied" from runc.
    - chmod 0755 /{{ $.ImageName }}

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-runtime-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  setup:
    - |
      pm install --rootDir /relocate \
        gnu-glibc \
        e2fsprogs \
        xfsprogs \
        lvm2 \
        util-linux
    - mkdir -p /relocate/etc
    - if [ -x /relocate/sbin/ldconfig ]; then chroot /relocate /sbin/ldconfig; fi

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
# werf keys an import on the imported file's CONTENT, not on its mode, so the chmod above does not change
# this image's digest: without a cache bust the stage built before the fix keeps being reused and the
# module ships the old, root-only binary no matter how often it is rebuilt.
fromCacheVersion: "1"

git:
{{- include "image mount points" . }}

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-runtime-artifact
    add: /relocate
    to: /
    before: setup
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-golang-artifact
    add: /{{ $.ImageName }}
    to: /{{ $.ImageName }}
    before: setup

imageSpec:
  config:
    entrypoint: ["/{{ $.ImageName }}"]
